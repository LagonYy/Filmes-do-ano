<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmês</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="128x128" href="filmesfav.png">
</head>

<body>
    <h1>Filmês</h1>

    <div class="grid">
        <div class="month">
            <h2>Janeiro</h2>
            <div class="movies" id="jan"></div>
        </div>
        <div class="month">
            <h2>Fevereiro</h2>
            <div class="movies" id="fev"></div>
        </div>
        <div class="month">
            <h2>Março</h2>
            <div class="movies" id="mar"></div>
        </div>
        <div class="month">
            <h2>Abril</h2>
            <div class="movies" id="abr"></div>
        </div>
        <div class="month">
            <h2>Maio</h2>
            <div class="movies" id="mai"></div>
        </div>
        <div class="month">
            <h2>Junho</h2>
            <div class="movies" id="jun"></div>
        </div>
        <div class="month">
            <h2>Julho</h2>
            <div class="movies" id="jul"></div>
        </div>
        <div class="month">
            <h2>Agosto</h2>
            <div class="movies" id="ago"></div>
        </div>
        <div class="month">
            <h2>Setembro</h2>
            <div class="movies" id="set"></div>
        </div>
        <div class="month">
            <h2>Outubro</h2>
            <div class="movies" id="out"></div>
        </div>
        <div class="month">
            <h2>Novembro</h2>
            <div class="movies" id="nov"></div>
        </div>
        <div class="month">
            <h2>Dezembro</h2>
            <div class="movies" id="dez"></div>
        </div>
    </div>

    <footer>
        <p>by LagonY</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
